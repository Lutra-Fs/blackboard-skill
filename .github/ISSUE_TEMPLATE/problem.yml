name: Problem report
description: Report a reproducible problem or a compatibility result.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: |
        A patch is optional. Use synthetic data and example domains.
        Read the contribution guide before you share task conversations.
  - type: textarea
    id: task
    attributes:
      label: Task and expected behavior
      description: Give the requested result and its acceptance conditions.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the relevant error code and a description of the missing result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Supply commands and synthetic data that work without access to your institution.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Record the project version or commit, Python version, operating system, and browser backend.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and limits
      description: Record checks and results. Separate live observations from offline results. Record unverified cases.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context handoff
      description: Record useful attempts and next steps. A reviewed task prompt or conversation link is optional.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I examined the evidence, attachments, and shared context for private information.
          required: true
